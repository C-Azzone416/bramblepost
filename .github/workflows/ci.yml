name: CI

on:
  pull_request:
    branches:
      - develop
      - main
      - "release/**"
  push:
    branches:
      - develop

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Leak checks: counts and file names only. Standard and stand-in builds; never a story-mode build.
      - run: npm run leak-check
      - run: npx vite build --outDir dist-stand-in
        env:
          VITE_STORY_PACK: stand-in
      - run: npm run leak-check -- dist-stand-in
