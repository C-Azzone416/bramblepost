<svg class="svg-defs door-defs" aria-hidden="true" focusable="false"><defs>
<!-- Clementine Fernsby, rabbit (bust). Copied from the Bramblepost proposal page. Uses #eyeGrad from src/ui/sprites.svg. -->
<symbol id="clem" viewBox="0 0 420 520">
  <defs>
    <linearGradient id="furR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c8b3"/><stop offset="1" stop-color="#b59d84"/></linearGradient>
    <radialGradient id="muz" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#fffaf2"/><stop offset="1" stop-color="#ead9c4"/></radialGradient>
    <linearGradient id="knit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9b445"/><stop offset="1" stop-color="#c88a26"/></linearGradient>
    <radialGradient id="earIn" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#f4b8ae"/><stop offset="1" stop-color="#d98e86"/></radialGradient>
  </defs>
  <!-- ears -->
  <g>
    <path d="M150 210 C 110 140, 96 40, 128 18 C 160 0, 186 90, 186 196Z" fill="url(#furR)"/>
    <path d="M150 196 C 124 140, 118 60, 136 42 C 154 30, 170 100, 172 186Z" fill="url(#earIn)"/>
    <path d="M250 196 C 268 120, 300 30, 338 34 C 372 40, 330 150, 282 214Z" fill="url(#furR)"/>
    <path d="M262 190 C 282 124, 306 60, 330 56 C 350 56, 320 140, 280 196Z" fill="url(#earIn)"/>
  </g>
  <!-- cardigan body -->
  <path d="M60 520 C 60 420, 110 360, 210 352 C 310 360, 362 420, 362 520Z" fill="url(#knit)"/>
  <path d="M210 360 L 176 520 M210 360 L 244 520" stroke="#a96f17" stroke-width="5" fill="none"/>
  <path d="M176 520 L 210 362 L 244 520Z" fill="#f4ecdf"/>
  <g fill="#7a3f1c"><circle cx="190" cy="420" r="7"/><circle cx="184" cy="470" r="7"/></g>
  <g stroke="#d49a32" stroke-width="3" fill="none" opacity=".55">
    <path d="M90 450 q10 -8 20 0 q10 8 20 0 M80 490 q10 -8 20 0 q10 8 20 0 q10 -8 20 0 M270 450 q10 -8 20 0 q10 8 20 0 M262 490 q10 -8 20 0 q10 8 20 0 q10 -8 20 0"/>
  </g>
  <!-- head -->
  <ellipse cx="210" cy="262" rx="118" ry="108" fill="url(#furR)"/>
  <path d="M96 270 l-18 10 l16 4 l-14 12 l20 0 l-6 14 l22 -12Z M324 270 l18 10 l-16 4 l14 12 l-20 0 l6 14 l-22 -12Z" fill="#c9b49c"/>
  <path d="M186 158 C 190 140, 204 136, 208 150 C 212 134, 228 136, 230 156 C 216 150, 200 150, 186 158Z" fill="#e6d6c2"/>
  <path d="M130 200 C 150 172, 190 160, 220 160" stroke="#efe3d4" stroke-width="10" fill="none" stroke-linecap="round" opacity=".5"/>
  <path d="M110 300 C 120 340, 160 366, 210 368 C 260 366, 300 340, 310 300 C 280 330, 140 330, 110 300Z" fill="#a8907a" opacity=".45"/>
  <ellipse cx="210" cy="300" rx="62" ry="48" fill="url(#muz)"/>
  <path d="M198 282 Q 210 274 222 282 Q 216 296 210 296 Q 204 296 198 282Z" fill="#e48e8c"/>
  <path d="M210 296 v12 M210 308 q-12 12 -24 4 M210 308 q12 12 24 4" stroke="#7a5446" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <ellipse cx="146" cy="300" rx="20" ry="10" fill="#f3998a" opacity=".45"/>
  <ellipse cx="274" cy="300" rx="20" ry="10" fill="#f3998a" opacity=".45"/>
  <!-- eyes -->
  <ellipse cx="164" cy="248" rx="16" ry="20" fill="url(#eyeGrad)"/><circle cx="170" cy="240" r="6" fill="#fff"/><circle cx="159" cy="256" r="2.5" fill="#fff"/>
  <ellipse cx="256" cy="248" rx="16" ry="20" fill="url(#eyeGrad)"/><circle cx="262" cy="240" r="6" fill="#fff"/><circle cx="251" cy="256" r="2.5" fill="#fff"/>
  <path d="M142 218 Q 162 206 182 214 M238 214 Q 258 206 278 218" stroke="#7d6450" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- spectacles, perched -->
  <g fill="none" stroke="#b07a2a" stroke-width="4.5">
    <circle cx="166" cy="258" r="30"/><circle cx="254" cy="258" r="30"/>
    <path d="M196 254 Q 210 244 224 254"/><path d="M136 252 L 104 242 M284 252 L 316 242"/>
  </g>
  <g fill="#fff" opacity=".35"><path d="M148 240 a26 26 0 0 1 22 -10 l-4 8 a18 18 0 0 0 -12 6z"/><path d="M236 240 a26 26 0 0 1 22 -10 l-4 8 a18 18 0 0 0 -12 6z"/></g>
