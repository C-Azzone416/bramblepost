name: CI

on:
  pull_request:
    branches:
      - develop
      - main
      - "release/**"
  push:
    branches:
      - develop

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Leak checks: counts and file names only. Standard and stand-in builds; never a story-mode build.
      - run: npm run leak-check
      - run: npx vite build --outDir dist-stand-in
        env:
          VITE_STORY_PACK: stand-in
      - run: npm run leak-check -- dist-stand-in

  phone-pass:
    name: Real-browser phone pass
    runs-on: ubuntu-latest
    env:
      # Standard pack only. The story pack path variable stays unset; no story-mode build here.
      VITE_STORY_PACK: standard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22"
          cache: npm

      - run: npm ci

      - id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-webkit-chromium

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit chromium
      # Browsers come from the cache, but system libraries are not cached.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit chromium

      # Output is test names and results only (list reporter; no trace, video, screenshots or artifacts).
      - run: npm run phone-pass
